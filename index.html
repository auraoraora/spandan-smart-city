<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E3B2E">
<meta property="og:title" content="Spandan">
<meta property="og:description" content="Your city's pulse: garbage van, water, traffic, air and power for your street, in your language.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Spandan</title>
<meta name="description" content="Spandan — a neutral smart city app for citizens and city managers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
/* Layout concept: a phone-first "pulse" app. Bottom tab bar on phones, left rail on desktop.
   Answer-first cards, each with its own mini chart. One deep-green brand surface per screen. */
:root{
  --bg:#F2F5EE; --surface:#FFFFFF; --surface2:#E9EFE5; --line:#D5DDD0;
  --ink:#10281F; --ink2:#42574B; --ink3:#6E8277;
  --brand:#0E3B2E; --brand2:#17573F; --onbrand:#F1F8F2; --onbrand2:#A7CDB7; --brandline:#2A6350;
  --leaf:#2B9360; --leafsoft:#DDF1E4; --sun:#E9A21B; --sunsoft:#FBEFCB;
  --bad:#CB4631; --badsoft:#F8DDD5; --info:#2C75A6; --infosoft:#DAE9F3;
  --shadow:0 1px 2px rgba(16,40,31,.06),0 10px 28px rgba(16,40,31,.08);
  --f-display:'Bricolage Grotesque','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Figtree','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:1; --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1612; --surface:#12231C; --surface2:#1A3027; --line:#274237;
  --ink:#E8F2EB; --ink2:#A8C0B2; --ink3:#7E988B;
  --brand:#14513C; --brand2:#1D6A4F; --onbrand:#F1F8F2; --onbrand2:#B4D8C3; --brandline:#2F7A5F;
  --leaf:#4CC084; --leafsoft:#173528; --sun:#F4B83F; --sunsoft:#3A2E10;
  --bad:#EF7660; --badsoft:#3D1F19; --info:#6CB1E1; --infosoft:#14293A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1612; --surface:#12231C; --surface2:#1A3027; --line:#274237;
  --ink:#E8F2EB; --ink2:#A8C0B2; --ink3:#7E988B;
  --brand:#14513C; --brand2:#1D6A4F; --onbrand:#F1F8F2; --onbrand2:#B4D8C3; --brandline:#2F7A5F;
  --leaf:#4CC084; --leafsoft:#173528; --sun:#F4B83F; --sunsoft:#3A2E10;
  --bad:#EF7660; --badsoft:#3D1F19; --info:#6CB1E1; --infosoft:#14293A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(15px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
#shell{min-height:100%;display:block}
.side{display:none}
.main{min-width:0;max-width:1100px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
@media(min-width:1000px){
  #shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;max-width:1440px;margin:0 auto}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;padding:28px 0}
  .main{padding-bottom:64px;width:100%}
  .tabbar{display:none!important}
}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:12px 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .brandmark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.top .spacer{flex:1}
.page{animation:pageIn .5s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- Side rail + tab bar ---------- */
.side .logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin-bottom:18px}
.navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;color:var(--ink2);text-align:left;width:100%;transition:background .2s,color .2s}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="page"]{background:var(--brand);color:var(--onbrand)}
.navbtn svg{width:22px;height:22px;flex:none}
.side .cityfoot{margin-top:auto;padding:14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:.85rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;gap:2px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .navbtn{flex-direction:column;gap:3px;padding:7px 4px;font-size:.68rem;text-align:center;justify-content:center;flex:1;min-width:0;border-radius:12px}
.tabbar .navbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar .navbtn[aria-current="page"]{background:var(--leafsoft);color:var(--brand)}
:root[data-theme="dark"] .tabbar .navbtn[aria-current="page"]{color:var(--leaf)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar .navbtn[aria-current="page"]{color:var(--leaf)}}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.brand{background:var(--brand);color:var(--onbrand);position:relative;overflow:hidden}
.card.brand .muted{color:var(--onbrand2)}
.card.sun{background:var(--sunsoft)}
.card.bad{background:var(--badsoft)}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7.4vw,3.4rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em;text-wrap:balance}
.h3{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-wrap:balance}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.02em}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.cap{font-size:.85rem;color:var(--ink2);margin-top:8px;text-wrap:pretty}
.src{font-size:.72rem;color:var(--ink3);margin-top:8px;display:flex;align-items:center;gap:6px}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--leaf);flex:none}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.card.brand .eyebrow{color:var(--onbrand2)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 -2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;font-weight:700;
  background:var(--surface2);color:var(--ink);transition:transform .15s var(--ease),background .2s,box-shadow .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--onbrand)}
.btn.sun{background:var(--sun);color:#2A1D00}
.btn.leaf{background:var(--leaf);color:#04210F}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.onbrand{background:var(--onbrand);color:var(--brand)}
.btn.danger{background:var(--badsoft);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.85rem}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icobtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);position:relative;flex:none}
.icobtn svg{width:20px;height:20px}
.icobtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 13px;border-radius:999px;background:var(--surface2);font-size:.85rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);color:var(--onbrand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.good{background:var(--leafsoft);color:var(--leaf)}
.pill.warn{background:var(--sunsoft);color:var(--sun)}
.pill.bad{background:var(--badsoft);color:var(--bad)}
.pill.info{background:var(--infosoft);color:var(--info)}
.pill.mute{background:var(--surface2);color:var(--ink2)}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 12px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.field{width:100%;min-height:48px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s}
.field:focus{border-color:var(--leaf)}
textarea.field{min-height:92px;resize:vertical}
.divider{height:1px;background:var(--line);margin:4px 0}
.squiggle{display:block;width:150px;height:14px;margin-top:6px;color:var(--sun)}
.squiggle path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.3s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.live{width:8px;height:8px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 0 var(--leaf);animation:beat 1.6s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.squiggle path{stroke-dashoffset:0}}

/* ---------- Charts & maps ---------- */
.chart text{font-family:var(--f-body);fill:var(--ink2);font-size:10px}
.chart .t-strong{fill:var(--ink);font-weight:700}
.chart .t-on{fill:var(--onbrand)}
.chart .t-on2{fill:var(--onbrand2)}
.chart .grid{stroke:var(--line);stroke-width:1}
.s-leaf{stroke:var(--leaf)}.s-sun{stroke:var(--sun)}.s-bad{stroke:var(--bad)}.s-info{stroke:var(--info)}.s-ink{stroke:var(--ink)}.s-ink3{stroke:var(--ink3)}.s-on{stroke:var(--onbrand)}.s-line{stroke:var(--line)}
.f-leaf{fill:var(--leaf)}.f-sun{fill:var(--sun)}.f-bad{fill:var(--bad)}.f-info{fill:var(--info)}.f-ink{fill:var(--ink)}.f-line{fill:var(--line)}.f-surface{fill:var(--surface)}.f-surface2{fill:var(--surface2)}.f-brand{fill:var(--brand)}.f-on{fill:var(--onbrand)}.f-ink3{fill:var(--ink3)}
.draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);animation:draw 1.4s .1s var(--ease) forwards}
.grow-y{transform-origin:50% 100%;animation:growY .8s var(--ease) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.tile:hover{transform:translateY(-2px)}
.tile .tv{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1}
.tile.off{opacity:.7;cursor:default}
.tile.off:hover{transform:none}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.mapwrap svg{width:100%;height:auto}
.mapwrap .pin{cursor:pointer;transition:transform .2s var(--ease);transform-box:fill-box;transform-origin:center}
.mapwrap .pin:hover,.mapwrap .pin.hot{transform:scale(1.25)}
.pulse-ring{transform-box:fill-box;transform-origin:center;animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.maplinks{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.maplinks a{font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.numpin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;flex:none}
.nb-fix{background:var(--leaf)}.nb-doing{background:var(--sun);color:#2A1D00}.nb-new{background:var(--bad)}.nb-event{background:var(--info)}
.meter{display:flex;gap:3px}.meter i{width:14px;height:8px;border-radius:3px;background:var(--line)}
.meter.l1 i:nth-child(1){background:var(--leaf)}
.meter.l2 i:nth-child(-n+2){background:var(--sun)}
.meter.l3 i{background:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--leaf);transition:width .8s var(--ease)}
.bar.sun>i{background:var(--sun)}.bar.bad>i{background:var(--bad)}.bar.info>i{background:var(--info)}
.card.brand .bar{background:var(--brandline)}
.card.brand .bar>i{background:var(--sun)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;max-width:300px}
.cal i{aspect-ratio:1;border-radius:50%;background:var(--brandline);display:block}
.cal i.ok{background:var(--sun)}.cal i.today{box-shadow:0 0 0 2px var(--onbrand)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);flex:none}
.li .ic svg{width:20px;height:20px}
.li .time{font-family:var(--f-display);font-weight:700;font-size:.95rem;min-width:62px;text-align:right}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.check.on{background:var(--leaf);border-color:var(--leaf);color:#04210F}
.check svg{width:16px;height:16px;opacity:0}.check.on svg{opacity:1}
.bin{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:.9rem}
.bin::before{content:"";width:12px;height:12px;border-radius:3px;background:currentColor}
.bin.green{background:#D9F2DF;color:#13693A}.bin.blue{background:#D8E8F7;color:#1E5C99}.bin.red{background:#F8DAD4;color:#B03621}.bin.black{background:#E3E3E3;color:#2B2B2B}
:root[data-theme="dark"] .bin.green{background:#173F29;color:#6FDD9F}:root[data-theme="dark"] .bin.blue{background:#16314B;color:#7FBEF0}:root[data-theme="dark"] .bin.red{background:#43211B;color:#F3917D}:root[data-theme="dark"] .bin.black{background:#2C2C2C;color:#D8D8D8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bin.green{background:#173F29;color:#6FDD9F}:root:not([data-theme="light"]) .bin.blue{background:#16314B;color:#7FBEF0}:root:not([data-theme="light"]) .bin.red{background:#43211B;color:#F3917D}:root:not([data-theme="light"]) .bin.black{background:#2C2C2C;color:#D8D8D8}}

/* ---------- Community posts ---------- */
.post{display:flex;flex-direction:column;gap:10px}
.post .acts{display:flex;gap:6px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:.85rem;color:var(--ink2);transition:all .2s var(--ease)}
.act svg{width:17px;height:17px}
.act.on{background:var(--leafsoft);color:var(--leaf)}
.act:active{transform:scale(.94)}
.track{display:flex;align-items:flex-start;gap:0;margin:6px 0}
.track .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;font-size:.68rem;color:var(--ink3);font-weight:600}
.track .st::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.track .st:first-child::before{display:none}
.track .st i{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:3px solid var(--line);z-index:1;display:block}
.track .st.done{color:var(--ink)}.track .st.done i{background:var(--leaf);border-color:var(--leaf)}
.track .st.done::before{background:var(--leaf)}
.track .st.now i{box-shadow:0 0 0 5px color-mix(in srgb,var(--leaf) 25%,transparent)}
.cmt{padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:.9rem}
.cmt b{font-size:.8rem}
.cmt.city{background:var(--infosoft)}
.timer{font-variant-numeric:tabular-nums}

/* ---------- Sheets, toast, FAB, chat ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,20,14,.55);animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;z-index:90;left:50%;bottom:0;width:min(560px,100%);max-height:88%;overflow:auto;transform:translateX(-50%);background:var(--bg);border-radius:26px 26px 0 0;
  padding:12px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));animation:sheetUp .35s var(--ease) both;box-shadow:0 -20px 60px rgba(0,0,0,.3)}
@keyframes sheetUp{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media(min-width:700px){.sheet{bottom:auto;top:50%;border-radius:26px;max-height:86%;animation:popIn .3s var(--ease) both}@keyframes popIn{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}.sheet{transform:translate(-50%,-50%)}}
.toast{position:fixed;z-index:120;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(440px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:.92rem;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:toastIn .35s var(--ease) both;display:flex;gap:12px;align-items:center}
.toast button{font-weight:800;color:var(--sun);white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

function chHours(vals,{nowI=-1,from=6,to=22,w=300,h=120,cls='leaf',badAbove=null,unit=''}={}){

function chCompare(you,nb,{w=300,h=130}={}){

  s+=`<path d="${pth(nb)}" fill="none" class="s-sun" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/><path class="draw s-leaf" style="--len:${w*2}" d="${pth(you)}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;

function chSpark(vals,{w=120,h=36,col='var(--sun)'}={}){

const CHIPS={en:['When is the garbage van?','Is the air OK for a walk?','When should I leave for work?','Any power cut today?','How do I report a pothole?','Which bin for batteries?'],
 hi:['कचरा गाड़ी कब आएगी?','क्या टहलने के लिए हवा ठीक है?','काम के लिए कब निकलूँ?','आज बिजली कटेगी?','गड्ढे की शिकायत कैसे करूँ?','बैटरी किस डिब्बे में?']};
function botReply(q){
  const D=sim(),hi=S.lang==='hi',s=q.toLowerCase(),Lv=leaveAt(),a=aqiInfo(D.aqi),ar=areaName(curArea());
  const m=(...w)=>w.some(x=>s.includes(x));
  if(m('bin','डिब्बा','battery','बैटरी','medicine','दवा','bottle','बोतल')){const b=BINS.find(x=>s.includes(x[0].toLowerCase().split(' ')[0].replace(/s$/,''))||s.includes(x[1].split(' ')[0]));
    return b?(hi?`${b[1]}: ${t({wet:'wet',dry:'dry',haz:'haz',ew:'ew'}[b[2]])} डिब्बा।`:`${b[0]}: ${t({wet:'wet',dry:'dry',haz:'haz',ew:'ew'}[b[2]])} bin.`):(hi?'वह चीज़ लिखें, जैसे “बैटरी” या “बोतल”। कचरा और बिजली पेज पर पूरी सूची है।':'Name the item, like “battery” or “bottle”. The full list is on the Waste & Power page.')}
  if(m('garbage','van','trash','waste','कचरा','गाड़ी'))return has('garbage')?(hi?`${ar} में कचरा गाड़ी आज ${fmtT(D.vanMin)} पर आएगी। पिछले हफ़्ते एक दिन (गुरुवार) 35 मिनट देर हुई थी। आने से 10 मिनट पहले हम सूचना देंगे।`:`The van reaches ${ar} at ${fmtT(D.vanMin)} today. Last week it was 35 minutes late once (Thursday). We will ping you 10 minutes before it arrives.`):t('notThere',{f:t('garbage'),city:cname()});
  if(m('water','पानी','tank','टंकी'))return has('water')?(hi?`${ar} में पानी ${fmtT(D.waterS)} से ${fmtT(D.waterS+90)} तक। कल 40 मिनट देरी है, इसलिए आज रात टंकी भर लें।`:`Water in ${ar} runs ${fmtT(D.waterS)} to ${fmtT(D.waterS+90)}. Tomorrow starts 40 minutes late, so fill your tank tonight.`):t('notThere',{f:t('water'),city:cname()});
  if(/\bair\b/.test(s)||m('aqi','walk','हवा','टहल','pollution','प्रदूषण')){let b=Math.max(D.nowI,6),bv=1e9;for(let i=b;i<=21;i++)if(D.aqiH[i]<bv){bv=D.aqiH[i];b=i}
    return hi?`अभी AQI ${D.aqi} है (${a.hi})। सबसे साफ़ हवा ${fmtT(b*60)} के आसपास होगी, AQI करीब ${bv}। ${D.aqi>150?'बाहर मास्क पहनें।':''}`:`AQI is ${D.aqi} right now (${a.en}). Air is cleanest around ${fmtT(b*60)}, near ${bv}. ${D.aqi>150?'Wear a mask outside.':'A walk is fine then.'}`}
  if(m('leave','work','traffic','office','निकल','ट्रैफिक','ऑफ़िस','काम के'))return hi?`${fmtT(Lv.dep)} पर निकलें, ${fmtT(Lv.arr)} तक पहुँचेंगे। 8:40 पर निकलने से ${Lv.saved} मिनट बचेंगे। ${city().road} पर शाम 6 बजे सबसे ज़्यादा भीड़ होती है।`:`Leave at ${fmtT(Lv.dep)} and you arrive by ${fmtT(Lv.arr)}. That is ${Lv.saved} minutes faster than leaving at 8:40. ${city().road} is busiest around 6 PM.`;
  if(m('power','cut','बिजली','light','solar','सोलर'))return has('power')?(hi?`आज ${ar} में ${fmtT(D.cuts[0].s)} से ${fmtT(D.cuts[0].e)} तक बिजली कटेगी (${L(D.cuts[0].why)})। शहर की ${D.solarShare}% बिजली आज सूरज से है।`:`Power is off in ${ar} from ${fmtT(D.cuts[0].s)} to ${fmtT(D.cuts[0].e)} today (${L(D.cuts[0].why)}). ${D.solarShare}% of the city’s power is from the sun today.`):t('notThere',{f:t('power'),city:cname()});
  if(m('report','complain','pothole','शिकायत','गड्ढ','drain','नाली'))return hi?'शिकायत टैब खोलें और बोलें, फ़ोटो लें या लिखें। पड़ोसी 24 घंटे वोट और टिप्पणी कर सकते हैं। ज़्यादा वोट (वार्ड की आबादी के हिसाब से) शिकायत को निगम की सूची में ऊपर ले जाते हैं।':'Open the Report tab and speak, take a photo or type. Neighbours can upvote and comment for 24 hours. More upvotes, counted against the ward’s population, move it up the city’s fix list.';
  if(m('event','कार्यक्रम','weekend','मेला'))return D.events.map(e=>`${L(e.n)} · ${L(e.when)} · ${areaName(e.at)}`).join('\n');
  if(m('score','स्कोर'))return hi?`${cname()} का स्कोर ${D.score}/100 है: आना-जाना ${D.parts.move}, सफ़ाई ${D.parts.clean}, पानी-बिजली ${D.parts.util}, हवा ${D.parts.air}।`:`${cname()} scores ${D.score}/100: getting around ${D.parts.move}, cleanliness ${D.parts.clean}, water & power ${D.parts.util}, air ${D.parts.air}.`;
  if(/\b(hello|hi|hey|namaste)\b/.test(s)||s.includes('नमस्ते'))return t('botHi',{city:cname()});
  return t('botUnknown');
}

   <div class="lock"><div class="clock num">7:00</div><div class="date">${d.toLocaleDateString(S.lang==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div class="notif"><b>SPANDAN · ${t('morning')}</b>${esc(t(new Date().getHours()<12?'gm':'ga'))}, ${esc(cname())}. ${it.map(x=>esc(x.title)).join(' · ')}</div>
    ${has('garbage')?`<div class="notif"><b>SPANDAN · ${t('vanTitle')}</b>${esc(t('vanAlert'))}<br><button class="nbtn" data-act="van-ready" type="button">${t('imReady')}</button><button class="nbtn" data-act="sheet-close" type="button">${t('skipToday')}</button></div>`:''}
    <div class="widget"><div><div style="font-size:.75rem;opacity:.8">${t('cityScore')}</div><div style="font-family:var(--f-display);font-weight:800;font-size:1.8rem">${D.score}</div></div><div><div style="font-size:.75rem;opacity:.8">AQI</div><div style="font-family:var(--f-display);font-weight:800;font-size:1.8rem">${D.aqi}</div></div><div><div style="font-size:.75rem;opacity:.8">${t('garbage')}</div><div style="font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin-top:6px">${fmtT(D.vanMin)}</div></div></div></div>
   <p class="cap">${t('nPref',{p:t({morning:'mOnly',important:'impOnly',all:'everything'}[S.notif]),q:S.quiet?t('on'):t('off')})}</p>
   <button class="btn primary full" style="margin-top:10px" data-act="previewnote" type="button">${t('preview')}</button>`)};
ACT.previewnote=()=>{closeSheet();toast(`7:00 · ${dayItems().slice(0,3).map(x=>x.title).join(' · ')}`)};

/* ====== Settings ====== */
ACT.settings=()=>{const c=city();
  openSheet(`<div class="row between"><h2 class="h2">${t('settings')}</h2><button class="icobtn" data-act="sheet-close" type="button" aria-label="${t('close')}">${ico('x')}</button></div>
  <div class="stack" style="margin-top:14px">
   <div><div class="eyebrow" style="margin-bottom:8px">${t('language')}</div><div class="row wrap" style="gap:8px">${Object.keys(LANGS).map(k=>`<button class="chip" aria-pressed="${S.lang===k}" data-act="setlang" data-l="${k}" type="button" lang="${k}">${LANGS[k].name}</button>`).join('')}</div>${FULL_LANGS.includes(S.lang)?'':`<p class="cap">${S.lang==='ta'?'தமிழ்: முக்கிய பகுதிகள் மட்டும். மீதி ஆங்கிலத்தில்.':'বাংলা: মূল অংশগুলি। বাকিটা ইংরেজিতে।'}</p>`}</div>
   <div><div class="eyebrow" style="margin-bottom:8px">${t('theme')}</div><div class="seg">${['light','dark','system'].map(m=>`<button aria-selected="${S.theme===m}" data-act="settheme" data-m="${m}" type="button">${t(m==='system'?'auto':m)}</button>`).join('')}</div></div>
   <div><div class="eyebrow" style="margin-bottom:8px">${t('textSize')}</div><div class="seg">${[.9,1,1.2].map(z=>`<button aria-selected="${S.textSize===z}" data-act="setsize" data-z="${z}" type="button" style="font-size:${z}rem">A</button>`).join('')}</div></div>
   <label><div class="eyebrow" style="margin-bottom:8px">${t('city')}</div><select class="field" id="setcity">${CITIES.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(L(x.n))} · ${esc(x.st)}</option>`).join('')}</select></label>
   <label><div class="eyebrow" style="margin-bottom:8px">${t('wArea')}</div><select class="field" id="setarea">${c.areas.map(a=>`<option ${a===curArea()?'selected':''} value="${esc(a)}">${esc(areaName(a))}</option>`).join('')}</select></label>
   <div class="row wrap"><button class="btn ghost" data-act="replay" type="button">${ico('pulse').replace('<svg','<svg width="18" height="18"')}${t('replay')}</button>${S.role==='manager'?`<button class="btn sun" data-act="nav" data-p="exit" type="button">${t('citizenView')}</button>`:`<button class="btn sun" data-act="officer" type="button">${ico('lock').replace('<svg','<svg width="18" height="18"')}${t('officer')}</button>`}</div></div>`)};
Object.assign(ACT,{
 setlang:el=>{S.lang=el.dataset.l;applyLang();ACT.settings()},settheme:el=>{S.theme=el.dataset.m;applyPrefs();renderChrome();$$('[data-act="settheme"]').forEach(b=>b.setAttribute('aria-selected',b===el))},
 setsize:el=>{S.textSize=+el.dataset.z;applyPrefs();$$('[data-act="setsize"]').forEach(b=>b.setAttribute('aria-selected',b===el))},
 replay:()=>{closeSheet();welcomeOpen()},
});
document.addEventListener('change',e=>{
  if(e.target.id==='setcity'){S.city=e.target.value;S.area=city().areas[0];VAN={p:null,sim:false,alerted:false};CHAT=[];save();render(true);ACT.settings();toast(cname()+' · '+feedList(city()))}
  if(e.target.id==='setarea'){S.area=e.target.value;save();render(true)}
});

/* ====== Boot ====== */
(function boot(){
  applyPrefs();
  if(!CITIES.some(c=>c.id===S.city))S.city='bhopal';
  render();
  if(!S.onboarded)welcomeOpen();
  if(location.hash==='#officer')ACT.officer();
})();
</script>
</body>
</html>
